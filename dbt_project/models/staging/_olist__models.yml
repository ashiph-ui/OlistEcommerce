version: 2

models:
  - name: stg_olist__orders
    description: One row per order. The core fact source.
    data_tests:              
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('olist', 'olist_orders_dataset')

    columns:
      - name: order_id
        description: Unique identifier, one unique order_id per row
        data_tests: 
          - not_null
          - unique
      
      - name: order_status
        description: 8 distinct options for order status.
        data_tests:                 
          - not_null
          - accepted_values:
              arguments:
                values: ['approved','canceled', 'created', 'delivered', 'invoiced', 'processing', 'shipped', 'unavailable']

      - name: customer_id
        description: generated every order
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id

  - name: stg_olist__customers
    description: one row per customer_id, which Olist generates per order, so effectively one row per order.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source("olist", "olist_customers_dataset")
      
    columns:
      - name: customer_id
        description: id generated every order
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: customer_id
    
      - name: customer_unique_id
        description: identifies the real person; repeats across rows when someone places multiple orders.
        data_tests:
          - not_null
          
  - name: stg_olist__reviews
    description: reviews for orders, can be done for the same order.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - review_id
              - order_id
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source("olist", "olist_order_reviews_dataset")

    columns:
      - name: review_id
        description: A generated id for each review.
        data_tests:
          - not_null
          
      
      - name: order_id
        description: identifier for which order the reviews are being made for. Can reoccur.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref("stg_olist__orders")
                field: order_id
      
      - name: review_score
        description: scoring the order from 1-5.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false


  - name: stg_olist__payments
    description: each row represents a payment and its installment sequence (when they are not paying all of the expenses in one go) 
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source("olist", "olist_order_payments_dataset")
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential
    
    columns: 
      - name: order_id
        description: instances of orders for payments
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref("stg_olist_orders")
                field: order_id
        
      - name: payment_sequential
        desciption: which payment method this is, when an order was paid with more than one.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: payment_installments
        desciption: number of monthly instalments the customer chose to split that payment into.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
        
      - name: payment_value
        desciption: the raw value of the payment
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  
  - name: stg_olist__items
    description: a row represents an item ordered for a given order. Order_id can appear more than once where multiple items have been orders
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source("olist", "olist_order_items_dataset")
      
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id

    columns:
      - name: order_id
        description: identifier for which order an item is associated to
        data_tests:
          - not_null

      - name: order_item_id
        description: identifier for which item within the order
        data_tests:
          - not_null
        
      - name: product_id
        description: identifier for which the specific product
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref("stg_olist__products")
                field: product_id
          

      - name: seller_id
        description: identifier for the seller of the order
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref("stg_olist__sellers")
                field: seller_id

      - name: price
        description: price of the item sold
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      
      - name: freight_value
        description: shipping cost of the item sold
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true


  - name: stg_olist__sellers
    description: identifies all sellers and details their location
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source("olist", "olist_sellers_dataset")

    columns:
      - name: seller_id
        description: all unique sellers for olist
        data_test:
          - not_null
          - unique

  
  - name: stg_olist__geolocation
    description: identifies all sellers and details their location
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source("olist", "olist_geolocation_dataset")


  - name: stg_olist__products
    description: each row describes a unique product within the inventory
                  610 products have no descriptive metadata (category, name length,
                  description length, photo count all null together); these fail as 
                  a block, suggesting listings that were never completed
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments: 
            compare_model: source("olist", "olist_products_dataset")
    
    columns:
      - name: product_id
        description: unique product_id
        data_tests:
          - not_null
          - unique
          
      - name: product_category 
        description:  >
          Portuguese category name from the source. Two categories
          (pc_gamer and portateis_cozinha_e_preparadores_de_alimentos,
          13 products total) have no row in the translation table, so
          the relationships test runs at warn severity. English names
          fall back to the Portuguese value downstream.

        data_tests:
          - relationships:
              config:
                severity: warn
              arguments: 
                to: ref("stg_olist__category")
                field: product_category

      - name: product_weight_g
        description: weight of product in grams 
        data_tests:
          - not_null:
              config:
                severity: warn

      
      - name: product_length
        description: length of product in cm 
        data_tests:
          - not_null:
              config:
                severity: warn
      
      - name: product_height_cm
        description: height of product in cm 
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: product_width_cm
        description: width of product in cm
        data_tests:
          - not_null:
              config:
                severity: warn
  
  
      
        