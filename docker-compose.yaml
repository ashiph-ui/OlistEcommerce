services:
  postgres:
    container_name: olist-postgres
    image: postgres:16 # Exact version
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB} #optional (specify default database instead of $POSTGRES_DB)
    ports:
      # Host 5433 -> container 5432. Host port 5433 avoids a collision with a
      # host-native Postgres already bound to 127.0.0.1:5432. Keep POSTGRES_PORT
      # in .env in sync with the host side of this mapping.
      - "5433:5432"

    volumes:
      # Named volume: data survives `docker compose down` / container restarts.
      - olist_pgdata:/var/lib/postgresql/data

      # Anything in db/init runs once, automatically, the FIRST time the
      # container starts with an empty data volume (creates our schemas).
      - ./db/init:/docker-entrypoint-initdb.d
      
    restart: unless-stopped

volumes:
  olist_pgdata: